<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Massinha Strike</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2036;font-family:"Trebuchet MS","Comic Sans MS",sans-serif;color:#fff;user-select:none}
canvas{display:block;position:fixed;inset:0}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 40%,rgba(120,70,140,.55),rgba(25,15,35,.92));z-index:20}
.screen.on{display:flex}
h1{font-size:68px;margin:0;color:#ffd36b;text-shadow:0 5px 0 #c9742f,0 10px 0 rgba(0,0,0,.35);letter-spacing:2px;transform:rotate(-2deg)}
h2{margin:0 0 6px;font-size:34px;color:#ffd36b}
p.sub{margin:0 0 14px;opacity:.8}
button{font:inherit;font-size:22px;font-weight:bold;color:#fff;border:0;border-radius:26px;padding:14px 46px;min-width:290px;cursor:pointer;
background:#e9684f;box-shadow:inset -6px -8px 0 rgba(0,0,0,.2),inset 5px 6px 0 rgba(255,255,255,.35),0 8px 0 #8d3a2b,0 14px 18px rgba(0,0,0,.4);transition:transform .08s}
button:hover{transform:translateY(-3px) rotate(-1deg)}button:active{transform:translateY(5px)}
button.b2{background:#4f9be9;box-shadow:inset -6px -8px 0 rgba(0,0,0,.2),inset 5px 6px 0 rgba(255,255,255,.35),0 8px 0 #2b5a8d,0 14px 18px rgba(0,0,0,.4)}
button.b3{background:#7a7a8c;box-shadow:inset -6px -8px 0 rgba(0,0,0,.2),inset 5px 6px 0 rgba(255,255,255,.35),0 8px 0 #4a4a58,0 14px 18px rgba(0,0,0,.4)}
.row{display:flex;gap:14px;align-items:center;width:420px;justify-content:space-between;font-size:20px}
input[type=range]{width:220px;accent-color:#ffd36b}
.help{font-size:15px;line-height:1.7;opacity:.85;text-align:center;max-width:560px}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
#hud.on{display:block}
#vig{position:fixed;inset:0;background:radial-gradient(circle,transparent 45%,rgba(210,0,0,.85));opacity:0}
#lines{position:fixed;inset:0;opacity:0;background:repeating-conic-gradient(from 0deg,transparent 0 4deg,rgba(255,255,255,.35) 4.4deg 5deg);-webkit-mask-image:radial-gradient(circle,transparent 42%,#000 85%);mask-image:radial-gradient(circle,transparent 42%,#000 85%)}
#flash{position:fixed;inset:0;opacity:0;background:#fff}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.45)}
#hit{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0;color:#ff4040;font-size:30px;line-height:26px;text-align:center;font-weight:bold}
#bars{position:fixed;left:24px;bottom:24px;width:260px}
.bar{height:20px;border-radius:12px;background:rgba(0,0,0,.45);margin-top:8px;overflow:hidden;box-shadow:inset 0 3px 0 rgba(0,0,0,.3)}
.bar i{display:block;height:100%;border-radius:12px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),inset 0 4px 0 rgba(255,255,255,.3)}
#hp i{background:#e9684f;width:100%}#sh i{background:#f2c94c;width:0}
#ammo{position:fixed;right:28px;bottom:24px;text-align:right;font-size:46px;font-weight:bold;text-shadow:0 4px 0 rgba(0,0,0,.4)}
#ammo small{font-size:20px;display:block;opacity:.8}
#kills{position:fixed;left:24px;top:20px;font-size:24px;font-weight:bold;text-shadow:0 3px 0 rgba(0,0,0,.4)}
#buffs{position:fixed;left:24px;top:60px;font-size:20px;line-height:1.6;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#msg{position:fixed;left:0;right:0;top:14%;text-align:center;font-size:34px;font-weight:bold;color:#ffd36b;text-shadow:0 4px 0 rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
#inv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,10,30,.78);z-index:15}
#inv.on{display:flex}
.panel{background:#7b5aa6;border-radius:34px;padding:30px 40px;width:720px;box-shadow:inset -8px -10px 0 rgba(0,0,0,.2),inset 6px 8px 0 rgba(255,255,255,.25),0 12px 0 #4b3270,0 20px 30px rgba(0,0,0,.5)}
.slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:16px}
.slot{height:84px;border-radius:20px;background:rgba(0,0,0,.28);box-shadow:inset 0 5px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:18px;text-align:center;padding:6px}
.slot.big{grid-column:span 3;height:140px;background:rgba(255,211,107,.18)}
</style></head><body>
<div id="vis"></div>
<div id="hud"><div id="lines"></div><div id="vig"></div><div id="flash"></div><div id="cross"></div><div id="hit">✕</div>
<div id="kills"></div><div id="buffs"></div><div id="msg"></div>
<div id="bars"><div class="bar" id="hp"><i></i></div><div class="bar" id="sh"><i></i></div></div>
<div id="ammo"><small>AK-47</small><span id="am">30</span> <small style="display:inline">/ <span id="rs">90</span></small></div></div>

<div id="inv"><div class="panel"><h2> Inventário</h2>
<div class="slots">
<div class="slot big"><svg viewBox="0 0 300 80" width="300" height="80"><g stroke="#2b2b30" stroke-width="3" stroke-linejoin="round"><path d="M10 38 L70 30 L85 30 L90 44 L70 52 L15 56Z" fill="#b5733a"/><rect x="80" y="28" width="95" height="18" rx="5" fill="#3b3b40"/><rect x="170" y="30" width="95" height="12" rx="4" fill="#b5733a"/><rect x="262" y="33" width="34" height="6" rx="3" fill="#555"/><path d="M110 46 L150 46 L142 74 L112 74Z" fill="#2e2e32"/><path d="M92 46 L106 46 L102 66 L90 66Z" fill="#8a4f26"/></g></svg>
<div style="margin-left:18px;text-align:left"><b style="font-size:26px">AK-47</b><br>Dano 28 · Cabeça 60<br><span id="iammo"></span></div></div>
<div class="slot" id="s0"></div><div class="slot" id="s1"></div><div class="slot" id="s2"></div>
<div class="slot" id="s3"></div><div class="slot" id="s4"></div><div class="slot" id="s5"></div>
</div><p class="sub" style="margin-top:16px">Aperte TAB pra fechar</p></div></div>

<div class="screen on" id="menu"><h1>MASSINHA STRIKE</h1>
<button id="bPlay">Jogar</button><button class="b2" id="bSet">Configurações</button><button class="b3" id="bQuit">Sair</button>
</div>

<div class="screen" id="settings"><h2>Configurações</h2>
<div class="row">Campo de visão <input type="range" id="fov" min="60" max="120" value="80"><b id="fovv">80</b></div>
<div class="row">Sensibilidade <input type="range" id="sens" min="0.2" max="3" step="0.05" value="1"><b id="sensv">1</b></div>
<div class="row">Gráficos <select id="gfx" style="font-size:18px;padding:6px 10px;border-radius:12px"><option value="0">Baixo</option><option value="1">Médio</option><option value="2" selected>Alto</option></select></div>
<button class="b3" id="bBack">Voltar</button></div>

<div class="screen" id="pause"><h2>Pausado</h2><button id="bResume">Continuar</button><button class="b2" id="bSet2">Configurações</button><button class="b3" id="bMenu">Menu principal</button></div>
<div class="screen" id="end"><h1 id="endT">Você virou massinha!</h1><p class="sub" id="endS"></p><button id="bAgain">Jogar de novo</button><button class="b3" id="bMenu2">Menu principal</button></div>

/* ---------------------------------------------------------- helpers de estado */

/* sol e lua a partir da hora (tod 0..24) */
function updateSunMoon() {

  const tm = th - PI; moonDir.set(Math.cos(tm), Math.sin(tm) * .8, -.5).normalize();
  sunX.set(0, 1, 0).cross(sunDir); if (sunX.lengthSq() < 1e-6) sunX.set(1, 0, 0); sunX.normalize(); sunY.copy(sunDir).cross(sunX).normalize();

  W.env.tod = tod; info.tod = tod;

/* calcula o alvo de estado para (hora, clima) */
function computeTarget() {
  const T = tgt, k = KD, el = sunDir.y;
  const d = sstep(0, .42, el), n = 1 - sstep(-.30, .04, el), tw0 = Math.max(0, 1 - d - n), sum = d + n + tw0 || 1;
  const wd = d / sum, wn = n / sum, wt = tw0 / sum;
  const twTop = rising ? P.topDawn : P.topDusk, twHor = rising ? P.horDawn : P.horDusk;
  mix3(T, 'skyTop', P.topDay, wd, P.topNight, wn, twTop, wt);
  mix3(T, 'skyHor', P.horDay, wd, P.horNight, wn, twHor, wt);
  mix3(T, 'hemiSky', P.hsDay, wd, P.hsNight, wn, P.hsTwi, wt);
  mix3(T, 'hemiGnd', P.hgDay, wd, P.hgNight, wn, P.hgTwi, wt);
  mix3(T, 'cloudLit', P.clLitDay, wd, P.clLitNight, wn, P.clLitTwi, wt);
  mix3(T, 'cloudDark', P.clDkDay, wd, P.clDkNight, wn, P.clDkTwi, wt);
  const so = F.skyHor; T[F.fog] = T[so] * .94; T[F.fog + 1] = T[so + 1] * .94; T[F.fog + 2] = T[so + 2] * .94;
  setC(T, 'sunCol', [lerp(P.sunLo[0], P.sunHi[0], sstep(.02, .45, el)), lerp(P.sunLo[1], P.sunHi[1], sstep(.02, .45, el)), lerp(P.sunLo[2], P.sunHi[2], sstep(.02, .45, el))]);
  setC(T, 'moonCol', P.moon);
  T[F.sunInt] = SUN_MAX * sstep(-.03, .3, el);
  T[F.moonInt] = .5 * SUN_MAX * sstep(-.05, .28, moonDir.y) * (1 - d * .92) * (.55 + .45 * moonPhase);
  T[F.hemiInt] = .5 * wd + .36 * wt + .2 * wn;
  T[F.fogDens] = .003 + .0012 * wn + .002 * wt;
  T[F.cover] = .2; T[F.stars] = wn; T[F.aurora] = 0; T[F.sunSize] = .042; T[F.moonSize] = .052;
  T[F.glow] = .6 * (wd * .8 + wt * 1.3); T[F.wind] = .12;
  T[F.rain] = T[F.flakes] = T[F.sand] = T[F.leaf] = T[F.mote] = 0; T[F.tintA] = 0; T[F.heat] = 0; T[F.light] = 0; T[F.vis] = 1; T[F.pen] = 0; T[F.dps] = 0;

  const lightK = .14 + .86 * (wd + .55 * wt), pl = .5 + .5 * (wd + .6 * wt); // brilho de partículas "refletidas"

  setC(T, 'rainCol', P.rain); setC(T, 'flakeCol', P.flake); setC(T, 'sandCol', P.sand); setC(T, 'leafCol', P.leaf); setC(T, 'moteCol', P.mote); setC(T, 'flashCol', P.flash); setC(T, 'tint', P.flash);

  // --- clima
  if (k.cover !== undefined) T[F.cover] = k.cover;
  if (k.sky) { mixC(T, 'skyTop', k.sky.length ? scaleArr(C(k.sky[0]), tsc) : P.topDay, k.sky[2]); mixC(T, 'skyHor', scaleArr(C(k.sky[1]), tsc), k.sky[2]); mixC(T, 'hemiSky', scaleArr(C(k.sky[1]), tsc), k.sky[2] * .5); }

  else if (k.sky) { setC(T, 'fog', [T[F.skyHor] * .94, T[F.skyHor + 1] * .94, T[F.skyHor + 2] * .94]); }
  if (k.cloud) { mixC(T, 'cloudLit', scaleArr(C(k.cloud[0]), tsc), k.cloud[2]); mixC(T, 'cloudDark', scaleArr(C(k.cloud[1]), tsc), k.cloud[2]); }
  if (k.hemiT) mixC(T, 'hemiSky', scaleArr(C(k.hemiT[0]), k.night ? 1 : tsc), k.hemiT[1]);

  T[F.stars] = wn * (1 - T[F.cover] * .85) * (k.starsMul || 1);
  if (k.aurora) T[F.aurora] = k.aurora * Math.max(wn, .05 * wt);
  T[F.wind] = k.wind !== undefined ? k.wind : .12;
  if (k.rain) { T[F.rain] = k.rain; if (k.rainCol) setC(T, 'rainCol', C(k.rainCol)); scaleC(T, 'rainCol', pl); }
  if (k.flakes) { T[F.flakes] = k.flakes; if (k.flakeCol) setC(T, 'flakeCol', C(k.flakeCol)); scaleC(T, 'flakeCol', pl); if (k.flakeFall) T[F.flakeFall] = k.flakeFall; if (k.flakeSize) T[F.flakeSize] = k.flakeSize; }
  if (k.sand) { T[F.sand] = k.sand; if (k.sandCol) setC(T, 'sandCol', C(k.sandCol)); scaleC(T, 'sandCol', pl); }
  if (k.leaf) { T[F.leaf] = k.leaf; scaleC(T, 'leafCol', pl); }
  if (k.mote) { T[F.mote] = k.mote; if (k.moteCol) setC(T, 'moteCol', C(k.moteCol)); if (k.moteRise !== undefined) T[F.moteRise] = k.moteRise; if (k.moteSize) T[F.moteSize] = k.moteSize; }
  if (k.flashCol) setC(T, 'flashCol', C(k.flashCol));
  if (k.light) T[F.light] = k.light;
  if (k.tint) { setC(T, 'tint', C(k.tint[0])); T[F.tintA] = k.tint[1]; }
  if (k.heat) T[F.heat] = k.heat;
  if (k.vis) T[F.vis] = k.vis;
  if (k.pen) T[F.pen] = k.pen;
  if (k.dps) T[F.dps] = k.dps[1];
  // eclipse: progresso 0..1 (1 = totalidade)
  if (k.eclipse) {
    const s = sstep(.5, 1, eclipseT), s2 = sstep(.2, 1, eclipseT);

}
function scaleArr(c, m) { return [c[0] * m, c[1] * m, c[2] * m]; }

/* ---------------------------------------------------------------- shaders */
const MASK_GLSL = `
uniform sampler2D uMask; uniform vec4 uMaskT; uniform float uMaskOn; uniform float uRoofY;
bool hiddenByMask(vec3 w){
  if (uMaskOn < 0.5) return false;
  vec2 muv = (w.xz - uMaskT.xy) * uMaskT.zw;
  if (muv.x < 0.0 || muv.y < 0.0 || muv.x > 1.0 || muv.y > 1.0) return false;
  return texture2D(uMask, muv).r > 0.5 && w.y < uRoofY;

const SKY_VS = `
varying vec3 vDir;
void main(){
  vDir = position;
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  gl_Position = projectionMatrix * mv;
  gl_Position.z = gl_Position.w * 0.99999;
}`;
const SKY_FS = `
precision highp float;
uniform vec3 uSunDir, uSunX, uSunY, uMoonDir, uMoonX, uMoonY, uFlashDir;
uniform vec3 uTop, uHor, uFog, uSunCol, uGlowCol, uMoonCol, uCloudLit, uCloudDark, uFlashCol;
uniform float uSunSize, uMoonSize, uGlow, uStars, uCover, uAurora, uFlash, uEclipse, uTime, uPhase, uHorGlow, uFogSky;
uniform vec2 uCloudScroll;
uniform sampler2D uNoise;

  vec3 d = normalize(vDir);

  col = mix(col, uFog, uFogSky * (1.0 - smoothstep(0.0, 0.55, t)));

  float sd = dot(d, uSunDir);

  // nuvens (amostragem em fluxo uniforme: sem ramos por pixel => sem costuras de mipmap)
  float hc = max(h, 0.0);
  vec2 cuv = d.xz / (hc + 0.2) * 0.5 + uCloudScroll;
  float n = texture2D(uNoise, cuv).r * 0.62 + texture2D(uNoise, cuv * 2.7 + 0.31).g * 0.38;

  col += uGlowCol * (pow(max(sd, 0.0), 28.0) * 0.55 + pow(max(sd, 0.0), 5.0) * 0.20) * uGlow * (1.0 - cA * 0.7);
  col = mix(col, cCol, cA * 0.96);

  if (sd > 0.0) {

    float r = length(pr) / uSunSize;
    float disc = 1.0 - smoothstep(0.86, 1.0, r);
    float moonMask = 0.0;
    if (uEclipse > 0.001) {

  gl_FragColor = vec4(max(col, 0.0), 1.0);
  #include <tonemapping_fragment>
  #include <encodings_fragment>
}`;
